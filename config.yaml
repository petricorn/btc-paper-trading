# Bitcoin PAPER TRADING – minden paraméter itt van.
# Ez szimuláció: valódi pénz, tőzsdei számla és API kulcs NINCS.
# Ha bármit módosítasz, új config-verzió (hash) keletkezik, amit minden
# trade és jelzés mellé elmentünk.

instrument:
  coinbase_product: BTC-USD        # elsődleges forrás (Coinbase Exchange nyilvános API)
  kraken_pair: XBTUSD              # másodlagos forrás (Kraken nyilvános API)

portfolios:
  initial_capital_usd: "200"
  names: [P1, P2, P3, B1, B2]

costs:
  fee_rate: "0.004"                # 0,4% díj oldalanként
  slippage_rate: "0.0005"          # 0,05% csúszás (piaci jellegű teljesülésnél)
  min_trade_usd: "10"              # minimum ügyletméret (P1–P3); B2 heti részletei kivételek

risk:
  risk_per_trade: "0.015"          # kötésenkénti kockázat: a tőke 1,5%-a
  atr_period: 14                   # ATR14 a 4H gyertyákon
  stop_atr_mult: "2.0"             # stop = jelzés záróára − 2×ATR14(4H), belépéskor rögzítve
  trail_activation_r: "1.0"        # trailing csak +1R felett indul
  trail_atr_mult: "2.0"            # trailing szint = legmagasabb lezárt 4H záró − 2×ATR14
  partial_take_r: "2.0"            # részleges zárás 2R-nél
  partial_take_fraction: "0.5"     # a pozíció 50%-a
  cooldown_bars_4h: 1              # kiszállás után 1 db 4H gyertya cooldown
  kill_switch_enabled: true        # kill switch be (a Fázis 2 hangoló futásaiban kikapcsolva, lásd backtest)
  kill_switch_drawdown: "0.20"     # saját csúcs alatt 20% → a portfólió megáll
  kill_switch_liquidate: true      # megálláskor a nyitott pozíciót piaci áron zárja
  max_signal_age_seconds: 3600     # a jelzés után 1 órával már nincs belépés

strategies:
  P1:                              # trendkövető Donchian-kitörés, napi trendszűrővel
    type: donchian_breakout
    entry_lookback_days: 20        # 20 napos csúcs kitörése
    exit_lookback_days: 10         # 10 napos mélypont alatt kiszáll (jelzés)
    trend_sma_days: 200            # csak ha napi záró > SMA200
  P2:                              # trend + visszahúzódás (4H)
    type: trend_pullback
    trend_ema: 100                 # emelkedő trend: záró > EMA100 és EMA20 > EMA100
    rsi_pullback: "40"             # visszahúzódás: RSI14 a küszöb alatt volt...
    pullback_window: 3             # ...az előző 3 gyertya valamelyikén, majd visszafordulás
  P3:                              # mean reversion Bollinger-szalaggal (4H), csak oldalazó piacon
    type: bollinger_reversion
    bb_period: 20
    bb_std: "2.0"
    adx_max: "20"                  # csak ha ADX14 < 20
  B1:
    type: buy_and_hold             # az indulás napján mindent megvesz, és tart
  B2:
    type: weekly_dca               # 200 USD 26 egyenlő heti részletben
    installments: 26
    interval_days: 7

indicators:
  ema_fast: 20                     # P2 pullback EMA
  rsi_period: 14
  adx_period: 14

data:
  lookback_4h_bars: 600            # ennyi lezárt 4H gyertyán számolunk indikátort (fix ablak)
  lookback_1d_bars: 260            # ennyi lezárt napi gyertyán
  candle_close_grace_seconds: 10   # gyertya csak ennyivel a vége után számít lezártnak
  max_data_age_seconds: 180        # 3 percnél régebbi adat → nincs új trade
  crosscheck_max_diff: "0.005"     # Coinbase vs Kraken eltérés küszöbe (0,5%)
  max_clock_skew_seconds: 30       # saját óra vs Coinbase szerveridő
  m1_gap_settle_minutes: 30        # 1 perces hiány: ennyi perc után "nem volt kereskedés" percnek számít
  decision_gap_block_hours: 48     # 1H/1D hiány ennyi órán belül → nincs döntés
  max_m1_catchup_minutes: 10080    # egy futás legfeljebb 7 napnyi 1 perces gyertyát dolgoz fel
  alert_after_failed_runs: 3       # 3 egymást követő hibás futás → riasztás

http:
  timeout_seconds: 10
  max_retries: 5
  backoff_base_seconds: "1.0"
  min_interval_seconds: "0.15"     # kérések közti minimális szünet (rate limit)
  user_agent: "btc-paper-trading/0.1 (paper trading simulation)"

timezone_display: Europe/Budapest

# ---------------------------------------------------------------- Fázis 2: backteszt
backtest:
  data_start: "2018-01-01"         # a mintán belüli időszak kezdete (1 perces adat)
  holdout_start: "2026-05-22"      # az utolsó 6 hónap: érintetlen tartalék, csak a végén, egyszer
  holdout_end: "2026-11-22"
  run_offset_seconds: 120          # szimulált futás minden 4H zárás után 2 perccel
  retry_seconds: 300               # adat-hiba esetén 5 perc múlva újra (mint az élő cron)
  robustness_delay_max_seconds: 3300   # robusztussági próba: véletlen 0–55 perc késés
  train_months: 24                 # walk-forward: 24 hónap tanítás ...
  test_months: 6                   # ... után 6 hónap teszt, 6 havonta lépve
  min_trades: 6                    # legalább ennyi lezárt kötés a tanító ablakban
  plateau_ratio: "0.8"             # a szomszéd paraméterek átlag Sharpe-ja >= a választott 80%-a
  monte_carlo_runs: 10000
  grid:                            # stratégiánként 3 hangolható paraméter
    P1:
      entry_lookback_days: [10, 20, 30, 55]
      exit_lookback_days: [5, 10, 20]
      trend_sma_days: [100, 150, 200]
    P2:
      trend_ema: [50, 100, 200]
      rsi_pullback: ["30", "35", "40", "45"]
      pullback_window: [2, 3, 5]
    P3:
      bb_period: [20, 30]
      bb_std: ["1.5", "2.0", "2.5"]
      adx_max: ["15", "20", "25"]
